name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check src/

      - name: Run Ruff format check
        run: ruff format --check src/

      - name: Run MyPy type checking
        run: mypy src/jarvis --ignore-missing-imports

      - name: Run tests
        run: pytest tests/test_smoke_*.py -v --tb=short

      - name: Run all tests
        run: pytest tests/ -v --tb=short

  build:
    needs: lint-and-test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name jarvis src/jarvis/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: dist/jarvis.exe
          retention-days: 7

  health-check:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-windows
          path: dist/

      - name: Test binary runs
        run: |
          cd dist
          # Test that binary starts and exits cleanly (with timeout)
          timeout 10s jarvis.exe --help || true

  deploy-dev:
    needs: health-check
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-windows
          path: dist/

      - name: Deploy to dev environment
        run: |
          echo "Deploy to dev environment..."
          # Add your deployment logic here (e.g., copy to server, update service, etc.)

  release:
    needs: health-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/jarvis.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
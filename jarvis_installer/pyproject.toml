[project]
name = "jarvis-installer"
version = "2.0.0-dev"
description = "JARVIS CyberBot Auto-Installer & Auto-Updater"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Carlos Costa", email = "carlos@exemplo.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core
    "PyQt6>=6.7",
    "sounddevice>=0.4.6",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "pillow>=10.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
    "playwright>=1.40",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "mss>=9.0",
    "psutil>=5.9",
    "send2trash>=1.8",
    "youtube-transcript-api>=0.6",
    "python-pptx>=0.6.23",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "cryptography>=41.0",
    "python-multipart>=0.0.6",
    "qrcode[pil]>=7.4",
    "mediapipe>=0.10",
    "faster-whisper>=1.0",
    "ctranslate2>=4.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.26",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    # Observability & Telemetry
    "aiohttp>=3.9",
    "packaging>=23.0",
    "jinja2>=3.1",
    "textual>=0.50",
    "huggingface-hub>=0.21",
    # Knowledge Base & RAG
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "sqlite-vec>=0.1",
    # Guardrails & Security
    "email-validator>=2.1",
    # Versioning & Release
    "gitpython>=3.1",
    # Installer specific
    "typer>=0.9",
    "rich>=13.0",
    "aiohttp>=3.9",
    "packaging>=23.0",
    "jinja2>=3.1",
    "textual>=0.50",
    "huggingface-hub>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]

[project.scripts]
jarvis-installer = "jarvis_installer.__main__:main"
jarvis-tui = "jarvis_installer.cli.tui:run_tui"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PL", "RUF", "PERF", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "TRY", "NPY", "DTZ", "FA", "QF", "FLY", "INP", "PIE", "TID", "LOG", "RET"]
ignore = ["S101", "TRY003", "ARG001", "ARG002"]
per-file-ignores = {
    "tests/*": ["S101", "D100", "D101", "D102", "D103", "D104", "D107"],
    "jarvis_installer/scripts/*": ["S101"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = "jarvis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["jarvis_installer"]
omit = ["tests/*", "*/__pycache__/*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
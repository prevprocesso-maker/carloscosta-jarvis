<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── REMOTE SCREEN / WEBCAM ── */
    .msg-media {
      align-self:stretch; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:10px; animation:pop 0.18s ease;
    }
    .media-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .media-title { font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:#818cf8; }
    .media-time { font-size:10px; color:var(--muted); }
    .screen-image { display:block; width:100%; max-height:62vh; object-fit:contain; background:#02040a; border-radius:10px; }
    .media-actions { display:flex; gap:8px; margin-top:8px; }
    .media-link { flex:1; text-align:center; padding:8px 10px; border-radius:9px; background:var(--adim); color:#a5b4fc; text-decoration:none; font-size:11px; font-weight:700; }
    #webcam-viewer {
      position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
      padding:14px; background:rgba(2,4,10,.92); backdrop-filter:blur(8px);
    }
    #webcam-viewer.open { display:flex; }
    .webcam-panel { width:min(100%,980px); max-height:96vh; display:flex; flex-direction:column; background:#090c14; border:1px solid rgba(99,102,241,.35); border-radius:18px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.55); }
    .webcam-bar { display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid var(--border); }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#ef4444; box-shadow:0 0 12px #ef4444; animation:blink 1.2s infinite; }
    .webcam-title { flex:1; font-size:11px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }
    .webcam-close { border:1px solid rgba(248,113,113,.32); background:rgba(248,113,113,.1); color:#fca5a5; border-radius:9px; padding:7px 11px; font-size:10px; font-weight:700; cursor:pointer; }
    #webcam-image, #screen-live-image { display:block; width:100%; min-height:220px; max-height:calc(96vh - 54px); object-fit:contain; background:#000; }
    #webcam-state, #screen-live-state { padding:9px 12px; color:var(--muted); font-size:11px; text-align:center; }

    /* ── QUICK REMOTE CONTROLS ── */
    #quick-controls { flex-shrink:0; display:flex; gap:8px; padding:9px 12px; overflow-x:auto; border-top:1px solid var(--border); background:rgba(7,9,15,.97); }
    #quick-controls::-webkit-scrollbar { display:none; }
    .quick-btn { flex:0 0 auto; min-width:82px; padding:9px 11px; border:1px solid var(--border); border-radius:11px; color:var(--text); background:var(--surface); font-size:10px; font-weight:700; cursor:pointer; }
    .quick-btn.danger { color:#fca5a5; border-color:rgba(248,113,113,.25); background:rgba(248,113,113,.08); }
    .quick-btn.settings { min-width:42px; font-size:15px; color:#a5b4fc; }
    .remote-overlay { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(2,4,10,.9); backdrop-filter:blur(8px); }
    .remote-overlay.open { display:flex; }
    .remote-card { width:min(100%,440px); max-height:88vh; overflow:auto; padding:18px; border:1px solid rgba(99,102,241,.32); border-radius:18px; background:#0a0d16; box-shadow:0 22px 70px rgba(0,0,0,.6); }
    .remote-card h2 { font-size:15px; margin-bottom:7px; }
    .remote-card p { color:var(--muted); font-size:12px; line-height:1.55; }
    .remote-card-actions { display:flex; gap:9px; margin-top:17px; }
    .remote-card-actions button { flex:1; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-weight:700; cursor:pointer; }
    .remote-card-actions .confirm-danger { background:rgba(239,68,68,.15); color:#fca5a5; border-color:rgba(239,68,68,.35); }
    .quick-config-row { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
    .quick-config-row input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text); }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <div id="webcam-viewer" role="dialog" aria-modal="true" aria-label="Webcam ao vivo">
    <div class="webcam-panel">
      <div class="webcam-bar"><span class="live-dot"></span><span class="webcam-title">Webcam ao vivo</span><button class="webcam-close" onclick="stopRemoteWebcam()">FECHAR</button></div>
      <img id="webcam-image" alt="Transmissão ao vivo da webcam">
      <div id="webcam-state">Conectando à webcam…</div>
    </div>
  </div>
  <div id="screen-live-viewer" class="remote-overlay" role="dialog" aria-modal="true" aria-label="Tela do computador ao vivo">
    <div class="webcam-panel">
      <div class="webcam-bar"><span class="live-dot"></span><span class="webcam-title">Tela do computador ao vivo</span><button class="webcam-close" onclick="stopLiveScreen()">FECHAR</button></div>
      <img id="screen-live-image" alt="Transmissão ao vivo da tela do computador">
      <div id="screen-live-state">Conectando à tela…</div>
    </div>
  </div>
  <div id="confirm-overlay" class="remote-overlay" role="dialog" aria-modal="true" aria-label="Confirmar ação">
    <div class="remote-card"><h2 id="confirm-title">Confirmar ação</h2><p id="confirm-text"></p><div class="remote-card-actions"><button onclick="closeConfirm()">CANCELAR</button><button id="confirm-action" class="confirm-danger">CONFIRMAR</button></div></div>
  </div>
  <div id="quick-config" class="remote-overlay" role="dialog" aria-modal="true" aria-label="Configurar botões">
    <div class="remote-card"><h2>Botões configuráveis</h2><p>Escolha os atalhos exibidos e personalize seus nomes neste celular.</p><div id="quick-config-list"></div><div class="remote-card-actions"><button onclick="closeQuickConfig()">CANCELAR</button><button onclick="saveQuickConfig()">SALVAR</button></div></div>
  </div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <div id="quick-controls" aria-label="Ações rápidas"></div>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    async function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      const response = await fetch(url, opts);
      if (response.status === 401) {
        sessionStorage.removeItem('jarvis_token');
        sessionStorage.removeItem('jarvis_key');
        location.replace('/login');
      }
      return response;
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    let ws = null;
    let _wsRetry = null;
    function refreshKnownDeviceLogin() {
      sessionStorage.removeItem('jarvis_token');
      sessionStorage.removeItem('jarvis_key');
      location.replace('/login');
    }
    function connectRemoteSocket() {
      clearTimeout(_wsRetry);
      ws = new WebSocket(_wsUrl);
      ws.onopen = () => { sys('Remote session active.'); toast('Connected to JARVIS'); _restoreRemoteMedia(); };
      ws.onclose = async (event) => {
        if (event.code === 4001) {
          refreshKnownDeviceLogin();
          return;
        }
        try {
          const check = await fetch('/api/remote-media/status', {headers:_authHeader(), cache:'no-store'});
          if (check.status === 401) { refreshKnownDeviceLogin(); return; }
        } catch (_) {}
        sys('JARVIS offline — tentando reconectar automaticamente…');
        _wsRetry = setTimeout(connectRemoteSocket, 2000);
      };
      ws.onerror = () => {};
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'log')           append(m.speaker, m.text);
        if (m.type === 'status')        setStatus(m.state);
        if (m.type === 'wake')          sys('Wake word detected — connecting…');
        if (m.type === 'sys')           sys(m.text);
        if (m.type === 'file_received') _onFileReceived(m);
        if (m.type === 'screen_capture') _onScreenCapture(m);
        if (m.type === 'webcam_started') _showRemoteWebcam(m.generation);
        if (m.type === 'webcam_stopped') _hideRemoteWebcam();
        if (m.type === 'screen_live_started') _showLiveScreen(m.generation);
        if (m.type === 'screen_live_stopped') _hideLiveScreen();
        if (m.type === 'confirmation_required') confirmSystemAction(m.action);
      };
    }
    connectRemoteSocket();

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Remote screen / webcam ────────────────────────────────────────────────
    const _screenObjectUrls = [];

    async function _onScreenCapture(m = {}) {
      try {
        const res = await _authFetch(`/api/remote-media/screen?v=${m.version || Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('capture unavailable');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const card = document.createElement('div');
        card.className = 'msg-media';
        card.innerHTML = `<div class="media-head"><span class="media-title">Tela do computador</span><span class="media-time">agora</span></div><img class="screen-image" alt="Captura da tela do computador"><div class="media-actions"><a class="media-link" target="_blank" rel="noopener">ABRIR</a><a class="media-link" download="tela-jarvis.jpg">BAIXAR</a></div>`;
        card.querySelector('img').src = url;
        card.querySelectorAll('a').forEach(a => a.href = url);
        feed.appendChild(card);
        feed.scrollTop = feed.scrollHeight;
        _screenObjectUrls.push(url);
        toast('Captura da tela recebida');
      } catch (e) {
        sys('Não consegui carregar a captura da tela: ' + e.message);
      }
    }

    function _showRemoteWebcam(generation) {
      const viewer = document.getElementById('webcam-viewer');
      const image = document.getElementById('webcam-image');
      const state = document.getElementById('webcam-state');
      viewer.classList.add('open');
      state.textContent = 'Conectando à webcam…';
      image.onload = () => { state.textContent = 'AO VIVO — permanece aberta até você mandar fechar.'; };
      image.onerror = () => { state.textContent = 'Não foi possível abrir a webcam. Verifique se ela está livre e conectada.'; };
      image.src = `/api/remote-media/webcam?token=${encodeURIComponent(_authToken)}&generation=${encodeURIComponent(generation || 0)}&v=${Date.now()}`;
    }

    function _hideRemoteWebcam() {
      const viewer = document.getElementById('webcam-viewer');
      const image = document.getElementById('webcam-image');
      viewer.classList.remove('open');
      image.removeAttribute('src');
      document.getElementById('webcam-state').textContent = 'Webcam fechada.';
    }

    async function stopRemoteWebcam() {
      await _authFetch('/api/remote-media', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'webcam_stop' })
      });
      _hideRemoteWebcam();
    }

    function _showLiveScreen(generation) {
      const viewer = document.getElementById('screen-live-viewer');
      const image = document.getElementById('screen-live-image');
      const state = document.getElementById('screen-live-state');
      viewer.classList.add('open');
      state.textContent = 'Conectando à tela…';
      image.onload = () => { state.textContent = 'AO VIVO — permanece aberta até você fechar.'; };
      image.onerror = () => { state.textContent = 'Não foi possível transmitir a tela.'; };
      image.src = `/api/remote-media/screen-live?token=${encodeURIComponent(_authToken)}&generation=${encodeURIComponent(generation || 0)}&v=${Date.now()}`;
    }

    function _hideLiveScreen() {
      document.getElementById('screen-live-viewer').classList.remove('open');
      document.getElementById('screen-live-image').removeAttribute('src');
      document.getElementById('screen-live-state').textContent = 'Transmissão fechada.';
    }

    async function stopLiveScreen() {
      await remoteMedia('screen_live_stop');
      _hideLiveScreen();
    }

    async function remoteMedia(action) {
      const res = await _authFetch('/api/remote-media', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
      if (!res.ok) toast('Não foi possível executar');
      return res;
    }

    async function _restoreRemoteMedia() {
      try {
        const res = await _authFetch('/api/remote-media/status', { cache: 'no-store' });
        if (!res.ok) return;
        const state = await res.json();
        if (state.webcam_active) _showRemoteWebcam(state.webcam_generation);
        if (state.screen_live_active) _showLiveScreen(state.screen_live_generation);
      } catch (_) {}
    }
    addEventListener('beforeunload', () => _screenObjectUrls.forEach(url => URL.revokeObjectURL(url)));

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    const QUICK_ACTIONS = [
      { id:'screenshot', label:'📷 Print', run:() => remoteMedia('screenshot') },
      { id:'screen_live', label:'🖥️ Tela ao vivo', run:() => remoteMedia('screen_live_start') },
      { id:'webcam', label:'🎥 Webcam', run:() => remoteMedia('webcam_start') },
      { id:'lock', label:'🔒 Bloquear', danger:true, run:() => confirmSystemAction('lock') },
      { id:'shutdown', label:'⏻ Desligar', danger:true, run:() => confirmSystemAction('shutdown') },
      { id:'cancel_shutdown', label:'↩ Cancelar desligamento', run:() => systemAction('cancel_shutdown', true) },
      { id:'disconnect', label:'⛓ Desconectar', danger:true, run:() => confirmDisconnect() },
    ];
    const DEFAULT_QUICK = QUICK_ACTIONS.map((a, i) => ({ id:a.id, label:a.label, enabled:i < 5 }));
    let _quickConfig = loadQuickConfig();

    function loadQuickConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem('jarvis_quick_buttons') || 'null');
        if (Array.isArray(saved)) return DEFAULT_QUICK.map(d => Object.assign({}, d, saved.find(s => s.id === d.id) || {}));
      } catch (_) {}
      return DEFAULT_QUICK.map(x => Object.assign({}, x));
    }
    function renderQuickControls() {
      const bar = document.getElementById('quick-controls'); bar.innerHTML = '';
      _quickConfig.filter(c => c.enabled).forEach(c => {
        const action = QUICK_ACTIONS.find(a => a.id === c.id); if (!action) return;
        const btn = document.createElement('button');
        btn.className = 'quick-btn' + (action.danger ? ' danger' : '');
        btn.textContent = c.label || action.label; btn.onclick = action.run; bar.appendChild(btn);
      });
      const settings = document.createElement('button');
      settings.className = 'quick-btn settings'; settings.textContent = '⚙'; settings.title = 'Configurar botões';
      settings.onclick = openQuickConfig; bar.appendChild(settings);
    }
    function openQuickConfig() {
      const list = document.getElementById('quick-config-list'); list.innerHTML = '';
      _quickConfig.forEach(c => {
        const row = document.createElement('label'); row.className = 'quick-config-row';
        row.innerHTML = `<input type="checkbox" data-id="${c.id}" ${c.enabled ? 'checked' : ''}><input type="text" data-label="${c.id}" value="${esc(c.label)}" maxlength="28">`;
        list.appendChild(row);
      });
      document.getElementById('quick-config').classList.add('open');
    }
    function closeQuickConfig() { document.getElementById('quick-config').classList.remove('open'); }
    function saveQuickConfig() {
      _quickConfig = _quickConfig.map(c => ({
        id:c.id,
        enabled:document.querySelector(`[data-id="${c.id}"]`).checked,
        label:document.querySelector(`[data-label="${c.id}"]`).value.trim() || QUICK_ACTIONS.find(a => a.id === c.id).label,
      }));
      localStorage.setItem('jarvis_quick_buttons', JSON.stringify(_quickConfig));
      renderQuickControls(); closeQuickConfig(); toast('Botões atualizados');
    }
    function confirmSystemAction(action) {
      const shutdown = action === 'shutdown';
      document.getElementById('confirm-title').textContent = shutdown ? 'Desligar computador?' : 'Bloquear computador?';
      document.getElementById('confirm-text').textContent = shutdown
        ? 'O desligamento começará em 60 segundos. Você poderá cancelá-lo antes do prazo.'
        : 'A sessão do Windows será bloqueada imediatamente. Seus programas continuarão abertos.';
      document.getElementById('confirm-action').onclick = () => systemAction(action, true);
      document.getElementById('confirm-overlay').classList.add('open');
    }
    function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('open'); }
    async function systemAction(action, confirmed) {
      const res = await _authFetch('/api/remote-action', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action, confirmed:confirmed === true})
      });
      let data = {}; try { data = await res.json(); } catch (_) {}
      closeConfirm(); toast(res.ok ? (data.result || 'Ação executada') : (data.error || 'Ação não executada'));
    }
    function confirmDisconnect() {
      document.getElementById('confirm-title').textContent = 'Desconectar Controle Remoto?';
      document.getElementById('confirm-text').textContent = 'Este celular deixará de reconectar automaticamente. Para usar novamente, será necessário ler um novo QR Code.';
      document.getElementById('confirm-action').onclick = disconnectRemote;
      document.getElementById('confirm-overlay').classList.add('open');
    }
    async function disconnectRemote() {
      try { await _authFetch('/api/revoke-devices', {method:'POST'}); } catch (_) {}
      localStorage.removeItem('jarvis_device_token');
      sessionStorage.removeItem('jarvis_token'); sessionStorage.removeItem('jarvis_key');
      location.replace('/login');
    }
    renderQuickControls();

    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
